name: CrimeGraph AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crimegraph
          POSTGRES_PASSWORD: crimegraph_ci
          POSTGRES_DB: crimegraph_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Security scan (bandit)
        # -ll fails the build only on medium/high severity findings. The low-
        # severity findings this codebase has (demo hardcoded passwords in
        # auth_service.py, non-cryptographic random.Random for synthetic data
        # generation) are known, intentional, and documented in AUDIT.md --
        # not appropriate to fail CI over.
        run: bandit -r app -ll -f txt

      - name: Generate synthetic data + train model
        run: |
          python -m app.data.synthetic_generator
          python -m app.ml.train_risk_model

      - name: Run tests (CSV backend)
        run: pytest tests/ -v

      - name: Run tests (PostgreSQL backend)
        env:
          CRIMEGRAPH_DATABASE_URL: postgresql://crimegraph:crimegraph_ci@localhost:5432/crimegraph_ai
        run: pytest tests/test_services.py::test_postgres_backend_end_to_end -v

      - name: Full database verification script
        env:
          CRIMEGRAPH_DATABASE_URL: postgresql://crimegraph:crimegraph_ci@localhost:5432/crimegraph_ai
        run: python ../scripts/verify_database.py

      - name: Smoke-test the API boots
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "API is up"
              break
            fi
          done
          curl -sf http://localhost:8000/api/health
          curl -sf http://localhost:8000/api/dashboard/kpis > /dev/null
          curl -sf http://localhost:8000/api/prediction/hotspots > /dev/null
          kill $SERVER_PID

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit / component tests (Vitest)
        run: npx vitest run

      - name: Dependency audit (report only)
        # `npm audit` currently flags 2 high-severity Next.js/PostCSS advisories.
        # The real fix is a major-version jump to Next 16, which is a breaking
        # change this codebase has not been re-verified against (different
        # App Router internals, needs a full re-test pass). Rather than either
        # silently ignoring the advisories or blindly force-upgrading something
        # untested, this step surfaces them in every CI run so they stay visible
        # -- continue-on-error so it doesn't block merges on an issue that needs
        # a deliberate, tested upgrade rather than an automated one.
        run: npm audit --production || true
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Honesty note: this job was written to actually work on GitHub Actions'
    # runners, which have full internet access to download Playwright's
    # Chromium binary. It was NOT executed during development -- the sandbox
    # this repo was built in has no route to Playwright's CDN (confirmed by
    # testing). See frontend/playwright.config.ts and AUDIT.md.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          python -m app.data.synthetic_generator
          python -m app.ml.train_risk_model
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 15); do sleep 2; curl -sf http://localhost:8000/api/health && break; done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build and start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 15); do sleep 2; curl -sf http://localhost:3000/dashboard && break; done

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t crimegraph-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t crimegraph-frontend:ci ./frontend
