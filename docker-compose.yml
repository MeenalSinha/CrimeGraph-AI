version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - CRIMEGRAPH_CORS_ORIGINS=http://localhost:3000
    volumes:
      - backend_data:/app/app/data/generated
      - backend_models:/app/app/ml/artifacts

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_models:
