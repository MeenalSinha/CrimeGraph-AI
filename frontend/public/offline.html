<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrimeGraph AI -- Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050B18;
      color: #E6ECF7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      border: 1px solid #1B2C46;
      background: rgba(13,27,48,0.85);
      border-radius: 8px;
      padding: 32px 40px;
      max-width: 420px;
      text-align: center;
    }
    .badge {
      width: 44px; height: 44px; border-radius: 6px;
      background: linear-gradient(135deg, #FF8A3D, #FF5A36);
      display: flex; align-items: center; justify-content: center;
      color: #050B18; font-weight: 700; margin: 0 auto 16px;
    }
    h1 { font-size: 15px; letter-spacing: 0.15em; margin: 0 0 8px; }
    p { font-size: 13px; color: #7C8AA6; line-height: 1.6; }
    button {
      margin-top: 20px; padding: 10px 20px; border-radius: 6px; border: none;
      background: linear-gradient(135deg, #FF8A3D, #FF5A36); color: #050B18;
      font-weight: 600; font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">CG</div>
    <h1>YOU'RE OFFLINE</h1>
    <p>
      CrimeGraph AI can't reach the network right now. Pages and data you've already
      viewed this session -- KPIs, the last heatmap snapshot, alerts, case lists --
      remain available from cache. New page (not visited yet) can't load until
      connectivity returns.
    </p>
    <button onclick="location.reload()">Retry connection</button>
  </div>
</body>
</html>
